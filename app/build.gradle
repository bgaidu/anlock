plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android' version '1.9.0'
}

// 签名配置：仅通过环境变量配置正式发布密钥库
// 本地开发请使用 debug 构建 (./gradlew assembleDebug)，它会自动使用 debug keystore
// 发布构建 (./gradlew assembleRelease) 需要设置以下环境变量：
//   KEYSTORE_FILE      - 密钥库文件路径
//   KEYSTORE_PASSWORD  - 密钥库密码
//   KEY_ALIAS          - 别名 (可选，默认 kidslock)
//   KEY_PASSWORD       - 密钥密码 (可选，默认同 KEYSTORE_PASSWORD)
def keystoreFile = System.getenv("KEYSTORE_FILE")
def keystorePass = System.getenv("KEYSTORE_PASSWORD")
def keyAliasName = System.getenv("KEY_ALIAS") ?: "kidslock"
def keyPass = System.getenv("KEY_PASSWORD") ?: keystorePass

android {
    namespace 'com.kidslock.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.kidslock.app"
        minSdk 21
        targetSdk 33
        versionCode 26
        versionName "1.0.1.23"
    }

    signingConfigs {
        if (keystoreFile && keystorePass) {
            release {
                storeFile file(keystoreFile)
                storePassword keystorePass
                keyAlias keyAliasName
                keyPassword keyPass
            }
        }
        // 不再为 release 回退使用 debug keystore，避免"未包含任何有效的证书"错误
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystoreFile && keystorePass) {
                signingConfig signingConfigs.release
            } else {
                // 未配置发布密钥库时，release 构建不签名（需手动签名或配置密钥库）
                // 这避免了意外使用 debug 证书导致荣耀等设备安装失败
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Bundle APK splits for different ABIs - smaller APK for TV
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a'
            universalApk true
        }
    }
}

// material 1.11.0 通过 kotlin-bom:1.8.22 约束 kotlin-stdlib-jdk7/jdk8，
// 而离线缓存里只有 1.9.0（与项目使用的 Kotlin 版本一致）。
// 不强制对齐时，解析单测/运行时 classpath 会去拉 1.8.22 并失败。
configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin' &&
                details.requested.name.startsWith('kotlin-stdlib-jdk')) {
            details.useVersion '1.9.0'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.11.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.0"

    // R23 干扰项质量单测（test-only，不进 APK）
    // 离线环境无法从 Maven 拉取 junit，临时以 gradle 发行包内自带的同版本 jar 直接引用；
    // 联网构建时可改回：testImplementation 'junit:junit:4.13.2'
    testImplementation files('libs-test/junit-4.13.2.jar', 'libs-test/hamcrest-core-1.3.jar')
}

// 构建期校验：题库资产（PRD R12）。零新增依赖，使用 Gradle 自带 Groovy JsonSlurper。
task verifyQuestionBanks {
    doLast {
        def slurper = new groovy.json.JsonSlurper()
        // 拼音字表：pinyin_0..6.json（PRD R12 / 后续迭代 R22 分级字表）。
        // 阈值（已拍板 Q8）：学前(0)>=60、一~六(1..6)>=100、distinct(v)>=4、k/v 非空。
        // pinyin_5 还须与编译进 dex 的内置兜底字表 BuiltinPinyinBank 逐条一致（零回归底线）。
        def PINYIN_MIN = [0: 60, 1: 100, 2: 100, 3: 100, 4: 100, 5: 144, 6: 100]
        for (int g = 0; g <= 6; g++) {
            def pFile = file("src/main/assets/banks/pinyin_${g}.json")
            if (!pFile.exists()) throw new GradleException("缺失拼音题库资产: ${pFile}")
            def pObj = slurper.parse(pFile)
            def pEntries = pObj.entries
            if (pEntries == null || pEntries.isEmpty()) throw new GradleException("pinyin_${g}.json 条目为空")
            def minN = PINYIN_MIN[g]
            if (pEntries.size() < minN) throw new GradleException("pinyin_${g}.json 条目数应 >=${minN}，实际 ${pEntries.size()}")
            def pDistinctV = new HashSet(pEntries.collect { it.v })
            if (pDistinctV.size() < 4) throw new GradleException("pinyin_${g}.json 去重拼音数 < 4（实际 ${pDistinctV.size()}）")
            for (def e : pEntries) {
                if (!e.k || !e.v) throw new GradleException("pinyin_${g}.json 存在空字段 (k=${e.k}, v=${e.v})")
            }
            println "verifyQuestionBanks: pinyin_${g}.json OK（${pEntries.size()} 条，${pDistinctV.size()} 种拼音）"
        }

        // 与内置兜底字表 BuiltinPinyinBank.kt 逐条比对（仅 pinyin_5，升级零回归底线）
        def javaFile = file("src/main/java/com/kidslock/app/question/BuiltinPinyinBank.kt")
        if (!javaFile.exists()) throw new GradleException("缺失内置兜底字表: ${javaFile}")
        def text = javaFile.text
        def builtin = new HashSet()
        def matcher = text =~ /BankEntry\("([^"]*)",\s*"([^"]*)"\)/
        while (matcher.find()) { builtin << "${matcher.group(1)}|${matcher.group(2)}" }
        def asset = new HashSet(slurper.parse(file("src/main/assets/banks/pinyin_5.json")).entries.collect { "${it.k}|${it.v}" })
        if (builtin != asset) throw new GradleException("pinyin_5.json 与 BuiltinPinyinBank 不一致（字表漂移）")
        println "verifyQuestionBanks: pinyin_5.json 与 BuiltinPinyinBank 逐条一致（零漂移）"

        // 英语词表：english_0..6.json（PRD R12，D3 落地）。每级条目 >=60、k/v 非空、去重释义 >=4
        for (int g = 0; g <= 6; g++) {
            def engFile = file("src/main/assets/banks/english_${g}.json")
            if (!engFile.exists()) throw new GradleException("缺失英语题库资产: ${engFile}")
            def eObj = slurper.parse(engFile)
            def eEntries = eObj.entries
            if (eEntries == null || eEntries.isEmpty()) throw new GradleException("english_${g}.json 条目为空")
            if (eEntries.size() < 60) throw new GradleException("english_${g}.json 条目数应 >=60，实际 ${eEntries.size()}")
            def eDistinctV = new HashSet(eEntries.collect { it.v })
            if (eDistinctV.size() < 4) throw new GradleException("english_${g}.json 去重释义 < 4（实际 ${eDistinctV.size()}）")
            println "verifyQuestionBanks: english_${g}.json OK（${eEntries.size()} 条，${eDistinctV.size()} 种释义）"
        }

        // 语文词表：ciyu_0..6.json（词语/成语，D4 落地）。每级条目 >=60、k/v 非空、去重拼音 >=4
        for (int g = 0; g <= 6; g++) {
            def cFile = file("src/main/assets/banks/ciyu_${g}.json")
            if (!cFile.exists()) throw new GradleException("缺失语文题库资产: ${cFile}")
            def cObj = slurper.parse(cFile)
            def cEntries = cObj.entries
            if (cEntries == null || cEntries.isEmpty()) throw new GradleException("ciyu_${g}.json 条目为空")
            if (cEntries.size() < 60) throw new GradleException("ciyu_${g}.json 条目数应 >=60，实际 ${cEntries.size()}")
            def cDistinctV = new HashSet(cEntries.collect { it.v })
            if (cDistinctV.size() < 4) throw new GradleException("ciyu_${g}.json 去重拼音 < 4（实际 ${cDistinctV.size()}）")
            println "verifyQuestionBanks: ciyu_${g}.json OK（${cEntries.size()} 条，${cDistinctV.size()} 种拼音）"
        }
    }
}
preBuild.dependsOn verifyQuestionBanks
